<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#23301f;--mute:#5d6b57;--g:#2f6b3f;--g2:#cfe5c3;--accent:#e8833a;--line:#e3dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a12;--card:#1b261b;--ink:#eef3e6;--mute:#a4b39b;--g:#7fcf8f;--g2:#24402b;--line:#2c3b2c}}
:root[data-theme="dark"]{--bg:#121a12;--card:#1b261b;--ink:#eef3e6;--mute:#a4b39b;--g:#7fcf8f;--g2:#24402b;--line:#2c3b2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,'Segoe UI','DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3,.logo{font-family:'Fraunces',Georgia,serif;margin:0}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;color:var(--g)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap;justify-content:center}
nav a{padding:7px 12px;border-radius:99px;font-size:14px;font-weight:500}
nav a:hover,nav a.on{background:var(--g2);color:var(--g)}
.cartbtn,.btn{border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:99px;padding:10px 20px;background:var(--g);color:#fff}
:root[data-theme="dark"] .btn,:root[data-theme="dark"] .cartbtn{color:#10200f}
.btn.alt{background:var(--accent);color:#fff}.btn.ghost{background:transparent;color:var(--g);border:2px solid var(--g)}
main{max-width:1100px;margin:auto;padding:24px 20px 60px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;padding:30px 0}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.05;font-weight:800}
.hero h1 em{color:var(--accent);font-style:normal}
.hero p{color:var(--mute);font-size:18px;max-width:480px}
.blob{aspect-ratio:1;border-radius:42% 58% 55% 45%/50% 40% 60% 50%;background:linear-gradient(135deg,var(--g2),#f3c58f);display:grid;place-items:center;font-size:clamp(90px,20vw,190px);animation:morph 9s ease-in-out infinite}
@keyframes morph{50%{border-radius:58% 42% 40% 60%/45% 55% 45% 55%}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:26px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.stat b{font-family:Fraunces,serif;font-size:30px;color:var(--g);display:block}
h2.t{font-size:32px;margin:34px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;transition:.25s;cursor:pointer;display:block}
.cat:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 14px 30px #0002}
.cat .e{font-size:46px}.cat p{color:var(--mute);font-size:14px;margin:6px 0 0}
.about{background:var(--g2);border-radius:26px;padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:34px}
.about ul{margin:0;padding-left:18px;color:var(--mute)}
.pc{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.pc:hover{transform:translateY(-5px);box-shadow:0 12px 26px #0002}
.pi{height:170px;display:grid;place-items:center;font-size:76px;position:relative}
.tag{position:absolute;top:10px;left:10px;font:700 11px 'DM Sans';background:#fff;color:#2f6b3f;padding:3px 9px;border-radius:99px}
.pb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb p{margin:0;color:var(--mute);font-size:14px;flex:1}
.pr{font:800 20px Fraunces,serif;color:var(--g)}
.acts{display:flex;gap:8px}.acts .btn{flex:1;padding:9px 6px;font-size:13px}
.pagehead{background:var(--g2);border-radius:24px;padding:26px 30px;margin-bottom:10px}
.pagehead p{color:var(--mute);margin:6px 0 0}
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
form{display:grid;gap:12px}
input,textarea,select{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.soc a{background:var(--g2);color:var(--g);padding:7px 14px;border-radius:99px;font-weight:700;font-size:14px}
footer{text-align:center;color:var(--mute);padding:26px;border-top:1px solid var(--line);font-size:14px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--card);border-left:1px solid var(--line);z-index:20;padding:20px;transform:translateX(105%);transition:.3s;display:flex;flex-direction:column;box-shadow:-10px 0 30px #0003}
.drawer.open{transform:none}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ci span:nth-child(2){flex:1}.ci button{border:0;background:none;color:var(--accent);font-size:18px;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:var(--g);color:#fff;padding:12px 22px;border-radius:99px;z-index:30;transition:.3s;font-weight:700}
.toast.on{transform:translate(-50%,0)}
@media(max-width:760px){.hero,.about,.contact{grid-template-columns:1fr}.blob{max-width:260px;margin:auto}nav{order:3;width:100%}}
.pill{display:inline-block;background:var(--g2);color:var(--g);padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;margin-bottom:14px}
.heroart{position:relative}.chip{position:absolute;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px;box-shadow:0 8px 20px #0002;animation:fl 4s ease-in-out infinite}
.c1{top:6%;left:0}.c2{bottom:10%;right:0;animation-delay:1s}.c3{bottom:2%;left:6%;animation-delay:2s}
@keyframes fl{50%{transform:translateY(-10px)}}
.ticker{overflow:hidden;background:var(--g);color:#fff;border-radius:99px;padding:11px 0;margin:10px 0 6px;font-weight:700;font-size:14px}
:root[data-theme="dark"] .ticker{color:#10200f}
.ticker div{white-space:nowrap;display:inline-block;animation:tk 28s linear infinite}
@keyframes tk{to{transform:translateX(-50%)}}
.cat .go{display:block;margin-top:12px;color:var(--g);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;margin-bottom:8px}
.mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.mats div{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--g);border-radius:14px;padding:14px}
.mats b{display:block}.mats span{color:var(--mute);font-size:14px}
.quote{font-style:italic}.quote b{display:block;font-style:normal;margin-top:10px;color:var(--g)}
.news{background:linear-gradient(135deg,var(--g2),#f3c58f88);border-radius:26px;text-align:center;padding:34px 20px;margin-top:34px}
.news p{color:var(--mute);margin:6px 0 0}
.heroimg{width:100%;height:auto;display:block;border-radius:36px;box-shadow:0 24px 50px #0003;border:6px solid var(--card);transform:rotate(1.5deg);transition:.4s}.heroimg:hover{transform:rotate(0)}
.pi{height:auto;min-height:0;aspect-ratio:4/3;overflow:hidden}.pimg{display:block;width:100%;height:100%;max-height:none;object-fit:cover;padding:0;transition:.3s}.pc:hover .pimg{transform:scale(1.06)}
.hero{position:relative;padding:50px 0 40px;gap:44px}
.hero:before{content:"";position:absolute;inset:-30px -24px;z-index:-1;border-radius:44px;background:radial-gradient(circle at 85% 25%,#e8833a38,transparent 46%),radial-gradient(circle at 8% 85%,#4aa35e33,transparent 48%)}
.hero h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;font-size:clamp(46px,7.4vw,84px);letter-spacing:-1px;line-height:1.05}.hero h1 em{font-family:'Yellowtail','Playfair Display',cursive;font-style:normal;font-weight:400;font-size:1.3em;letter-spacing:0;line-height:1.1;display:inline-block;padding:0 6px 6px 0}
.hero h1 em{background:linear-gradient(90deg,#e8833a,#f5b94a,#e8833a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:200% 0}}
.hero p{font-size:20px;line-height:1.6}
.trust{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.trust span{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:99px;font-weight:700;font-size:14px}
.heroimg{border-radius:44px;box-shadow:0 30px 70px #0005,0 0 0 1px var(--line)}
.glass{position:absolute;background:#ffffffd9;color:#23301f;backdrop-filter:blur(10px);padding:12px 16px;border-radius:18px;box-shadow:0 14px 34px #0004;animation:fl 5s ease-in-out infinite}
.glass b{display:block;font-size:15px}.glass span{font-size:13px;opacity:.75}
.g1{top:-14px;right:-10px}.g2{bottom:18%;left:-22px;animation-delay:1.2s}.g3{bottom:-16px;right:12%;font-weight:700;font-size:14px;animation-delay:2.2s}
.btn.ghost,:root[data-theme="dark"] .btn.ghost{background:transparent;color:var(--g);border:2px solid var(--g)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn,:root:not([data-theme="light"]) .cartbtn{color:#10200f}:root:not([data-theme="light"]) .btn.ghost{color:var(--g)}:root:not([data-theme="light"]) .ticker{color:#10200f}}

 <h2 class="t">How We Make It</h2><div class="steps"><div class="box"><span class="n">1</span><h3>Source responsibly</h3><p>We choose certified hemp, bamboo, cork and jute from small farms, plus fibre recycled from plastic bottles.</p></div><div class="box"><span class="n">2</span><h3>Craft by hand</h3><p>Local artisans weave, stitch and shape every piece using plant-based dyes and zero harsh chemicals.</p></div><div class="box"><span class="n">3</span><h3>Pack without plastic</h3><p>Orders arrive in recycled paper and compostable mailers. Return old products and we recycle them.</p></div></div>
 <h2 class="t">Know Your Materials</h2><div class="mats"><div><b>🌾 Hemp</b><span>Strong, hypoallergenic and needs little water to grow.</span></div><div><b>🎋 Bamboo</b><span>Fast-growing, naturally antibacterial and biodegradable.</span></div><div><b>🍾 Cork</b><span>Harvested without cutting the tree. Light and supportive.</span></div><div><b>🧵 Jute</b><span>A natural plant fibre that is durable and fully compostable.</span></div><div><b>♻️ Recycled fibre</b><span>Plastic bottles turned into soft stuffing and plush.</span></div></div>
 <section class="about"><div><h2>About Us</h2><p style="color:var(--mute)">Wildroot began in Delhi when a rescued beagle chewed through one too many plastic toys. We asked a simple question: why should pet products cost the planet? Today we work with local artisans and eco-certified makers to craft essentials that are safe for animals and kind to the Earth.</p><a class="btn" href="#/contact" style="display:inline-block;margin-top:14px">Get in touch</a></div><ul><li>Natural, recycled & biodegradable materials</li><li>Plant-based dyes, no harmful chemicals</li><li>Fair pay for artisan partners</li><li>Repair, refill & return programme</li></ul></section>
 <h2 class="t">Loved by Pets & Their People</h2><div class="steps"><div class="box quote">“My lab destroys every toy, but the hemp tug has survived for months.”<b>– Aarav, Delhi</b></div><div class="box quote">“The cooling mat made summer so much easier for my senior dog.”<b>– Meera, Gurugram</b></div><div class="box quote">“Finally a cat cave that looks good in my living room and has no plastic.”<b>– Kavya, Noida</b></div></div>

function add(id,i){const c=CATS.find(x=>x.id===id),p=c.p[i];const f=cart.find(x=>x.n===p[0]);f?f.q++:cart.push({n:p[0],e:p[1],pr:p[2],q:1});upd();toast(p[0]+' added 🛒')}
function upd(){$('#cc').textContent=cart.reduce((a,b)=>a+b.q,0);$('#ci').innerHTML=cart.length?cart.map((x,i)=>`<div class="ci"><span>${x.e}</span><span>${x.n} × ${x.q}</span><span>₹${x.pr*x.q}</span><button onclick="cart.splice(${i},1);upd()">✕</button></div>`).join(''):'<p>Your cart is empty 🐾</p>';$('#tot').textContent='Total: ₹'+cart.reduce((a,b)=>a+b.pr*b.q,0)}
function drawer(o){$('#dr').classList.toggle('open',!!o)}
function checkout(){if(!cart.length)return toast('Cart is empty');cart=[];upd();drawer(0);toast('Order placed! Thank you 🌱 (demo)')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400)}
addEventListener('hashchange',render);render();upd();
